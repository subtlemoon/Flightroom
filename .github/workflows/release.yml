name: Build and release

# Every push to main runs the tests. When the "version" in package.json has no
# GitHub release yet, it also builds the Windows installer and publishes it as
# release v<version>; installed copies of GearCheck pick it up on next launch.
#
# Versions follow major.minor.patch: a new feature or tab bumps minor (1.2.0),
# a fix bumps patch (1.2.1), a big overhaul bumps major (2.0.0). Pushes that
# don't change the version (gear catalog or news updates) publish nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check whether this version is already released
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/${{ github.repository }}/releases/tags/v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish installer
        if: steps.version.outputs.publish == 'true'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
