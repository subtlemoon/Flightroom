name: Build and release

# Every push builds and tests the Windows app. On main, when the "version" in
# package.json has no GitHub release yet, the installer is published as release
# v<version>; installed copies pick it up on their next update check.
#
# Each release carries two update manifests:
#   latest.json  read by Flightroom (src-tauri/src/updater.rs)
#   latest.yml   read by GearCheck 1.x, so old installs update into Flightroom
#
# Versions follow major.minor.patch: a new feature or tab bumps minor (2.1.0),
# a fix bumps patch (2.0.1), a big overhaul bumps major (3.0.0). Pushes that
# don't change the version (gear catalog or news updates) publish nothing.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to see what changed since the last release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Desktop side tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build installer
        run: npx tauri build
      - name: Name installer and write update manifests
        id: out
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/Flightroom-Setup-$version.exe"
          node scripts/release-manifests.mjs "out/Flightroom-Setup-$version.exe" "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l out

      # An old GearCheck install updating into Flightroom, the way GearCheck's
      # updater does it: run the installer with --updated /S --force-run.
      # Only when something that hand-over depends on changed since the last
      # release, so ordinary fixes ship a few minutes sooner.
      - name: Check whether the GearCheck hand-over needs testing
        id: handover
        shell: bash
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -z "$last" ] || git diff --name-only "$last" HEAD -- src-tauri/installer-hooks.nsh src-tauri/tauri.conf.json src-tauri/src/migrate.rs src/bridge.js .github/workflows/release.yml | grep -q .; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the hand-over depends on changed since $last; skipping it."
            echo "test=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install GearCheck 1.5.0 and let it save its data
        if: steps.handover.outputs.test == 'true'
        shell: pwsh
        timeout-minutes: 5
        run: |
          Invoke-WebRequest https://github.com/subtlemoon/gearcheck/releases/download/v1.5.0/GearCheck-Setup-1.5.0.exe -OutFile gc.exe
          Start-Process .\gc.exe -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\gearcheck\GearCheck.exe"
          if (!(Test-Path $exe)) { throw "GearCheck did not install" }
          Start-Process $exe
          Start-Sleep 25
          Stop-Process -Name GearCheck -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
          Get-ChildItem "$env:APPDATA\GearCheck\Local Storage\leveldb" -ErrorAction SilentlyContinue | Format-Table Name, Length
      - name: Flightroom reads GearCheck's saved data
        if: steps.handover.outputs.test == 'true'
        shell: pwsh
        run: |
          $env:FLIGHTROOM_LEVELDB = "$env:APPDATA\GearCheck\Local Storage\leveldb"
          cargo test --manifest-path src-tauri/Cargo.toml reads_a_real_chromium_database -- --ignored --nocapture
      - name: Update GearCheck into Flightroom
        if: steps.handover.outputs.test == 'true'
        shell: pwsh
        timeout-minutes: 8
        run: |
          $setup = "out\Flightroom-Setup-${{ steps.out.outputs.version }}.exe"
          # Wait for the installer itself only: Start-Process -Wait would also
          # wait for the Flightroom it opens (--force-run), which never exits.
          $p = Start-Process $setup -ArgumentList '--updated', '/S', '--force-run' -PassThru
          if (!$p.WaitForExit(300000)) {
            Get-Process | Where-Object { $_.Name -match 'flightroom|gearcheck|setup|un_|Au_' } | Format-Table Id, Name, StartTime
            throw 'the installer did not finish within 5 minutes'
          }
          Write-Host "installer exit code: $($p.ExitCode)"
          Start-Sleep 10
          $failed = @()
          if (Test-Path "$env:LOCALAPPDATA\Programs\gearcheck") { $failed += 'old GearCheck folder still there' }
          if (!(Test-Path "$env:LOCALAPPDATA\Flightroom\flightroom.exe")) { $failed += 'Flightroom not installed' }
          if (!(Get-Process flightroom -ErrorAction SilentlyContinue)) { $failed += 'Flightroom did not start' }
          if (!(Test-Path "$env:APPDATA\GearCheck")) { $failed += 'GearCheck data folder was deleted' }
          Get-ChildItem "$env:USERPROFILE\Desktop", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter *.lnk | Format-Table FullName
          if (Test-Path "$env:USERPROFILE\Desktop\GearCheck.lnk") { $failed += 'old desktop shortcut still there' }
          if ($failed) { throw ($failed -join '; ') }
          Stop-Process -Name flightroom -Force
          Write-Host 'GearCheck updated into Flightroom'

      - uses: actions/upload-artifact@v4
        with:
          name: flightroom-${{ steps.out.outputs.version }}
          path: out/*
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.out.outputs.version }}
          if gh api "repos/${{ github.repository }}/releases/tags/v$v" > /dev/null 2>&1; then
            echo "v$v is already released; nothing to publish."
            exit 0
          fi
          # Upload as a draft first so updaters never see a release without its files.
          gh release create "v$v" out/* --draft --title "$v" --notes "Flightroom $v" --target "${{ github.sha }}"
          gh release edit "v$v" --draft=false --latest
