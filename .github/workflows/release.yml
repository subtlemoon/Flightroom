name: Build and release

# Every push to main builds a new Windows installer and publishes it as a
# GitHub release. Installed copies of GearCheck pick it up on next launch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set version from build number
        shell: bash
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version
      - name: Build and publish installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
