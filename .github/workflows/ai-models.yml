name: AI models

# Builds the on-device AI download (tools/ai-models/build.sh) and uploads it to
# the ai-models-1 release, where Flightroom fetches it the first time an AI
# feature is used (src-tauri/src/ai.rs). It is a prerelease, so it never
# counts as the app's latest version. Runs when the build changes on main.

on:
  push:
    branches: [main]
    paths: ['tools/ai-models/**', '.github/workflows/ai-models.yml']
  workflow_dispatch:

# Building runs third-party code (pip packages, the converters), so it gets a
# read-only token and keeps no git credentials. Only the publish job can write,
# and only for main: a manual run from another branch builds but never uploads.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install converters
        run: |
          pip install -r tools/ai-models/requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build
        run: tools/ai-models/build.sh out
      - uses: actions/upload-artifact@v6
        with:
          name: ai-models
          path: out/*
          retention-days: 3

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ai-models
          path: out
      - name: Upload to the ai-models-1 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view ai-models-1 >/dev/null 2>&1 || gh release create ai-models-1 --prerelease --title "AI models" \
            --notes "On-device AI for Flightroom's Develop tab (masks and AI Denoise). The app downloads these itself; there's nothing to install by hand."
          # The models first, the manifest last, so the app never sees a manifest for files that aren't up yet.
          gh release upload ai-models-1 $(ls out/* | grep -v manifest.json) --clobber
          gh release upload ai-models-1 out/manifest.json --clobber
