[package]
name = "flightroom"
version = "2.7.3"
description = "Flightroom: photo culling, RAW developing and camera gear planner"
authors = ["Jaewon"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "flightroom_lib"
crate-type = ["rlib"]

[[bin]]
name = "flightroom"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rawler = "0.8"
rayon = "1"
half = "2"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
ureq = { version = "3", features = ["json"] }
rusty-leveldb = "4"
jpeg-encoder = "0.6"
zune-jpeg = "0.5"
url = "2"
percent-encoding = "2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "directml", "half"] }

[dev-dependencies]
quick-xml = "0.42"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
libloading = "0.8"
